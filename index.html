<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <title>Last Month's Earthquakes</title>
</head>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<h1>Last Month's Earthquakes</h1>

<div id="vis">
    <div id="map"></div>
    <p id="hist-desc">Click and drag on the histogram to select a magnitude range. The earthquakes in that range will be highlighted on the map.</p>
    <div id="histogram"></div>
</div>

<!-- at bottom, show data source-->
<p>Data source: <a href="https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_month.geojson"
        target="_blank">USGS GeoJSON feed</a></p>

<script src="https://cdn.jsdelivr.net/npm/topojson@3"></script>
<!-- needed to load world map data, learned how to do this from Claud AI-->

<script>
    //loading in the data
    const URL = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_month.geojson';
    console.log('URL:', URL);
    d3.json(URL).then(async data => {
        const quakes = data.features.map(d => ({
            mag: d.properties.mag,
            place: d.properties.place,
            time: new Date(d.properties.time),
            lat: d.geometry.coordinates[1],
            lon: d.geometry.coordinates[0],
            depth: d.geometry.coordinates[2]
        }));

        //making sure loaded correctly
        console.log(quakes[0]);

        // making a color scale for magnitude. will be used in both historgram and map
        const colorScale = d3.scaleSequential()
            .domain(d3.extent(quakes, d => d.mag))
            .interpolator(d3.interpolateReds);

        // -- MAKING HISTOGRAM -- -----------------
        const margin = { top: 20, right: 20, bottom: 40, left: 50 };
        const width = 300;
        const height = 300;

        const svg = d3.select('#histogram')
            .append('svg')
            .attr('width', width)
            .attr('height', height);

        // scales 
        const x = d3.scaleLinear()
            .domain(d3.extent(quakes, d => d.mag)).nice()
            .range([margin.left, width - margin.right]);

        const bins = d3.histogram()
            .domain(x.domain())
            .thresholds(x.ticks(100)) //made a lot of buckets so it was smoother, shorter, wider
            (quakes.map(d => d.mag));

        const y = d3.scaleLinear()
            .domain([0, d3.max(bins, d => d.length)]).nice()
            .range([height - margin.bottom, margin.top]);

        // bars
        const bar = svg.selectAll('.bar')
            .data(bins)
            .enter().append('g')
            .attr('class', 'bar')
            .attr('transform', d => `translate(${x(d.x0)},${y(d.length)})`);

        bar.append('rect')
            .attr('x', 0)
            .attr('width', d => Math.max(0, x(d.x1) - x(d.x0)))
            .attr('height', d => y(0) - y(d.length))
            .attr('fill', d => colorScale((d.x0 + d.x1) / 2)) // color based on magnitude
            .attr('shape-rendering', 'crispEdges'); // makes it so there aren't gaps between bars

        // add axes
        svg.append('g')
            .attr('transform', `translate(0,${height - margin.bottom})`)
            .call(d3.axisBottom(x).ticks(10)); // made less ticks than bars for better readability

        svg.append('g')
            .attr('transform', `translate(${margin.left},0)`)
            .call(d3.axisLeft(y));

        // add x axis label
        svg.append('text')
            .attr('x', width / 2)
            .attr('y', height - 10)
            .attr('text-anchor', 'middle')
            .text('Magnitude');

        // --- MAKING MAP ---------- note: learned how to do projections and paths as part of final project
        // making seperate variables in case I want to change the size of the map and histogram differently
        const margin2 = { top: 20, right: 20, bottom: 20, left: 20 };
        const width2 = 500;
        const height2 = 500;

        const svg2 = d3.select('#map')
            .append('svg')
            .attr('width', width2)
            .attr('height', height2)
            .attr('style', 'border: 1px solid black'); // add border to see map area

        // load world map data, because the earthquake data doesn't have country outliens
        const world = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
        const countries = topojson.feature(world, world.objects.countries);

        const projectionWorld = d3.geoMercator()
            .fitSize([width2, height2], countries);

        const pathWorld = d3.geoPath().projection(projectionWorld);

        // create a pan/zoom group and draw countries inside it so the whole map can be zoomed/panned
        const mapG = svg2.append('g').attr('class', 'map-layer');

        const countriesG = mapG.append('g').attr('class', 'countries');
        countriesG.selectAll('path')
            .data(countries.features)
            .enter().append('path')
            .attr('d', pathWorld)
            .attr('fill', '#ccc')
            .attr('stroke', '#fff')
            .attr('stroke-width', 0.5);

        const projection = d3.geoMercator()
            .fitSize([width2 - margin2.left - margin2.right, height2 - margin2.top - margin2.bottom], {
                type: 'FeatureCollection',
                features: quakes.map(d => ({
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: [d.lon, d.lat]
                    }
                }))
            });

        const path = d3.geoPath().projection(projection);

        // draw earthquakes inside the same pan/zoom group so circles scale with the map
        const quakesG = mapG.append('g').attr('class', 'quakes');
        quakesG.selectAll('circle')
            .data(quakes)
            .enter().append('circle')
            .attr('cx', d => projection([d.lon, d.lat])[0])
            .attr('cy', d => projection([d.lon, d.lat])[1])
            .attr('r', 2)
            .attr('fill', d => colorScale(d.mag))
            .attr('opacity', 0.6);

        // add zoom behavior to the map SVG only (does not affect the histogram)
        // reference: https://d3js.org/d3-zoom (also needed to make group edits above)
        const zoom = d3.zoom()
            .scaleExtent([1, 8])
            .on('zoom', (event) => {
                mapG.attr('transform', event.transform);
            });

        svg2.call(zoom);

        // -- ADDING BRUSHING AND LINKING -- -----------------
        // references examples in assignment
        // the section of histogram that is brushed will link to the earthquakes that are shown on the map
        const brush = d3.brushX()
            .extent([[margin.left, margin.top], [width - margin.right, height - margin.bottom]]) // use histogram measures
            .on('brush end', brushed);

        svg.append('g')
            .attr('class', 'brush')
            .call(brush);

        function brushed({ selection }) {
            if (selection) {
                const [x0, x1] = selection.map(x.invert); // get magnitude range
                const selectedQuakes = quakes.filter(d => d.mag >= x0 && d.mag < x1);

                console.log('Selected quakes:', selectedQuakes); // debugging

                // update map to show only selected earthquakes
                svg2.selectAll('circle')
                    .attr('fill', d => (d.mag >= x0 && d.mag < x1) ? colorScale(d.mag) : '#ccc') // keep color based on magnitude
                    .attr('opacity', d => (d.mag >= x0 && d.mag < x1) ? 0.8 : 0.2) // highlight selected quakes, fade out others
                    .attr('stroke', d => (d.mag >= x0 && d.mag < x1) ? 'black' : 'none') // add stroke to selected quakes for better visibility
                    .attr('stroke-width', d => (d.mag >= x0 && d.mag < x1) ? 0.5 : 0); // stroke width for selected quakes
            } else {
                // if no selection, show all earthquakes equally
                svg2.selectAll('circle')
                    .attr('opacity', 0.6)
                    .attr('stroke', 'none')
                    .attr('stroke-width', 0);
            }
        }
    });
</script>




</html>
